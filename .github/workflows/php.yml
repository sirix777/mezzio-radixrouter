name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run cs-check
      run: composer cs-check

    - name: Run phpstan
      run: composer phpstan

    - name: Run phpunit
      run: composer test

  mezzio-router-compatibility:
    name: PHP ${{ matrix.php }} / mezzio-router ${{ matrix.mezzio-router }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
        mezzio-router: ['^3.20', '^4.1']

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}

    - name: Install dependencies for the selected Mezzio Router major version
      run: >-
        composer update --with-all-dependencies
        --with "mezzio/mezzio-router:${{ matrix.mezzio-router }}"
        --prefer-dist --no-interaction --no-progress

    - name: Run cs-check
      run: composer cs-check

    - name: Run phpstan
      run: composer phpstan

    - name: Run phpunit
      run: composer test
